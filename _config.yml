name: "Do-Yeon Kim"
title: "Professor · Department of Pharmacology"
institution: "School of Dentistry, Kyungpook National University"
email: dykim82@knu.ac.kr
photo: dykim.jpg

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?hl=ko&user=YK00g9oAAAAJ&view_op=list_works&sortby=pubdate"
  orcid: "https://orcid.org/0000-0003-2200-7396"
  github: ""
  researchgate: ""
  twitter: ""
  linkedin: ""
  cv: ""

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1d4ed8"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "Kim Lab · Department of Pharmacology, School of Dentistry, Kyungpook National University"
baseurl: ""
url: ""

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: research
  - name: publications  
  - name: people
  - name: contact

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Kim
  first_name: [D. Y., Do-Yeon, D.-Y.]
  style: citesty
  locale: en
  source: ./assets
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
